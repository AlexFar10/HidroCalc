[package]
name = "hidro-core"
version = "0.1.0"
description = "HidroCalc - logica de domeniu (calcule hidraulice, cote de teren), fără dependențe de interfață"
authors = ["Alexandru Farcaș & Bogdan Stana"]
license = "Proprietary"
edition = "2021"
rust-version = "1.92"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
ureq = "2"
png = "0.17"
serde_json = "1.0.154"
roxmltree = "0.21.2"
